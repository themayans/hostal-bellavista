# Local preview without installing Ruby:
#     docker compose up      →  http://localhost:4000/hostal-bellavista/
#
# For the marketing pages alone (no Jekyll needed, since they are plain
# generated HTML) a static server is enough:
#     py -m http.server 8090
services:
  jekyll:
    image: ruby:3.1
    working_dir: /site
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
volumes:
  bundle:
