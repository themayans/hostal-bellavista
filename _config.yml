# Jekyll configuration.
#
# This site has NO Jekyll templating at all. Every page is pre-generated by the
# Node scripts in scripts/ and committed as plain HTML, so Jekyll's only job
# here is to copy the tree through unchanged and drop the build tooling.
#
#   npm run build   →  regenerates index.html, en|it|de|ca/, legal/, thanks/,
#                      sitemap.xml, robots.txt and llms.txt
#
# Why no plugins: jekyll-sitemap would emit its own sitemap.xml and overwrite
# the generated one (which carries proper hreflang alternates), and
# jekyll-seo-tag needs a Liquid layout to inject into — there isn't one.

title: Hostal Restaurante Bellavista Formentera
description: >-
  Hostal and Mediterranean seafood restaurant on the first line of the port of
  La Savina, Formentera. Family-run since 1949.
author: Hostal Bellavista Formentera

# --- Domain -----------------------------------------------------------------
# Currently served from the GitHub Pages project URL. At custom-domain cutover
# set url to the live domain and baseurl to "", set BASE = "" in the three
# scripts/build-*.js files, re-run `npm run build`, and add a CNAME file.
# See DOMAIN-CUTOVER.md.
url: "https://themayans.github.io"
baseurl: "/hostal-bellavista"

lang: es

plugins: []

# Keep tooling and source material out of the published site
exclude:
  - README.md
  - HANDOVER.md
  - DOMAIN-CUTOVER.md
  - scripts
  - "*.ps1"
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - docker-compose.yml
  - _src
  - _incoming
